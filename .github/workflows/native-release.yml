name: Qualify and release portable DEB and CPU-native source RUN
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Build tools and pinned Common dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends build-essential binutils cmake git pkg-config libssl-dev libsqlite3-dev dpkg-dev util-linux
      - name: Qualify portable Debian and generate revision-pinned source-first native RUN
        run: |
          set -euo pipefail
          python3 -m py_compile standalone/build.py standalone/release.py
          python3 standalone/release.py release
          bootstrap="$(find dist -maxdepth 1 -type f -name '*.run' -print -quit)"
          test -s "$bootstrap"
          test "$(wc -c < "$bootstrap")" -lt 8192
          if grep -aF '__IFS_SOURCE_PAYLOAD_BELOW__' "$bootstrap"; then exit 1; fi
          grep -F "$GITHUB_SHA" "$bootstrap"
          python3 standalone/check-package.py dist/*.deb --profile portable
          sudo python3 standalone/check-documentation-upgrade.py dist/*.deb
          test "$(find dist -name '*.deb' | wc -l)" = 1
          test "$(find dist -name '*.run' | wc -l)" = 1
      - name: Prove source-first RUN creates CPU-native Debian with one SO and PDF
        run: |
          set -euo pipefail
          FS_SO="$(python3 -c 'import json; print(json.load(open("standalone/config.json"))["module"])')"
          FS_REPO="$(python3 -c 'import json; print(json.load(open("standalone/config.json"))["repository"])')"
          FS_ABI="$(python3 -c 'import json; print(json.load(open("standalone/config.json"))["abi"])')"
          FS_PDF="$(python3 -c 'import json; print(json.load(open("standalone/config.json"))["pdf"])')"
          run_file="$(find dist -maxdepth 1 -type f -name '*.run' -print -quit)"
          bash "$run_file" --profile aggressive --system-package-mode --build-only --output "$RUNNER_TEMP/native"
          deb_file="$(find "$RUNNER_TEMP/native" -maxdepth 1 -type f -name '*.deb' -print -quit)"
          test -s "$deb_file"
          test "$(dpkg-deb -f "$deb_file" X-Infiltrator-Native-Profile)" = aggressive
          test "$(dpkg-deb -f "$deb_file" X-Infiltrator-PGO)" = trained-two-pass
          test "$(dpkg-deb -f "$deb_file" X-Infiltrator-LTO)" = enabled
          test "$(dpkg-deb -f "$deb_file" X-Infiltrator-Source-Revision)" = "$GITHUB_SHA"
          mkdir -p "$RUNNER_TEMP/installed"
          dpkg-deb -x "$deb_file" "$RUNNER_TEMP/installed"
          test "$(find "$RUNNER_TEMP/installed" -type f | wc -l)" = 2
          test -s "$RUNNER_TEMP/installed/System/Filesystems/$FS_SO"
          test -s "$RUNNER_TEMP/installed/System/Resources/Documentation/$FS_REPO.pdf"
          readelf -Ws "$RUNNER_TEMP/installed/System/Filesystems/$FS_SO" | grep -F "$FS_ABI"
      - name: Verify fragmented 200 MiB corpus using both packaged native modules
        run: |
          set -euo pipefail
          work=$(mktemp -d)
          trap 'rm -rf "$work"' EXIT
          mkdir -p "$work/include/infiltratr" "$work/portable"
          curl -fsSL https://raw.githubusercontent.com/Infiltrator-Projects/Libraries/d23a52693fd3212368d327e1c1302e07ae9510ec/include/infiltratr/filesystem_module_v2.h -o "$work/include/infiltratr/filesystem_module_v2.h"
          cc -std=c11 -O2 -Wall -Wextra -Wpedantic -Werror -I"$work/include" tests/test_corpus.c -ldl -o "$work/corpus"
          dpkg-deb -x dist/*.deb "$work/portable"
          for root in "$work/portable" "$RUNNER_TEMP/installed"; do
            for sector in 512 4096; do
              "$work/corpus" "$root/System/Filesystems/MINIX.so" "$work/media.img" "$sector"
              if [ "$sector" = 512 ]; then
                # util-linux fsck.minix checks conventional 1 KiB Minix media.
                fsck.minix -f "$work/media.img"
              fi
              rm "$work/media.img"
            done
          done
      - uses: actions/upload-artifact@v4
        with:
          name: native-filesystem-release
          path: dist/*
          if-no-files-found: error
  publish:
    needs: qualify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: native-filesystem-release
          path: dist
      - name: Enforce exactly one Common V2 filesystem SO and no kernel driver
        shell: bash
        run: |
          set -euo pipefail
          test "$(find dist -maxdepth 1 -type f -name '*.deb' | wc -l)" = 1
          test "$(find dist -maxdepth 1 -type f -name '*.run' | wc -l)" = 1
          test "$(find dist -maxdepth 1 -type f -name '*.ko' | wc -l)" = 0
          python3 standalone/check-package.py dist/*.deb --profile portable
          mkdir -p "$RUNNER_TEMP/extracted"
          dpkg-deb -x dist/*.deb "$RUNNER_TEMP/extracted"
          test "$(find "$RUNNER_TEMP/extracted" -type f | wc -l)" = 2
          test -s "$RUNNER_TEMP/extracted/System/Filesystems/MINIX.so"
          bash tests/check-freestanding-v2.sh "$RUNNER_TEMP/extracted/System/Filesystems/MINIX.so"
          test -s "$RUNNER_TEMP/extracted/System/Resources/Documentation/Filesystem-Minix.pdf"
          test "$(find "$RUNNER_TEMP/extracted" -name '*.ko' | wc -l)" = 0
      - name: Publish and verify new immutable MINIX V2-only release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(tr -d '\r\n' < VERSION)"
          tag="v$version"
          # Never replace an immutable tag or publish from another source commit.
          test "$(git rev-parse HEAD)" = "$(git ls-remote origin refs/heads/main | cut -f1)"
          if gh release view "$tag" --json tagName >/dev/null 2>&1; then
            tag_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" --jq '.object.sha')"
            tag_type="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" --jq '.object.type')"
            if [[ "$tag_type" == tag ]]; then
              tag_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$tag_sha" --jq '.object.sha')"
            fi
            if [[ "$tag_sha" != "$GITHUB_SHA" ]]; then
              echo "Immutable $tag belongs to $tag_sha; no new release without VERSION bump"
              exit 0
            fi
          elif gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" >/dev/null 2>&1; then
            echo "REFUSING: tag $tag exists without a verified release" >&2
            exit 1
          fi
          (cd dist && sha256sum -- *.deb *.run > SHA256SUMS.txt && sha256sum -c SHA256SUMS.txt)
          if ! gh release view "$tag" --json tagName >/dev/null 2>&1; then
            gh release create "$tag" dist/*.deb dist/*.run \
              --target "$GITHUB_SHA" \
              --title "Common V2-only MINIX filesystem $version" \
              --notes "Verified Common V2 hosted and freestanding filesystem reader, self-contained Common V2 ELF, real native filesystem media and freestanding reader validation. One MINIX.so provides the canonical engine in both profiles. Includes Debian package and CPU-native source RUN. No filesystem-specific Linux kernel driver is delivered."
          fi
          remote="$RUNNER_TEMP/MINIX-release-check"
          mkdir -p "$remote"
          gh release download "$tag" -p '*.deb' -p '*.run' --dir "$remote"
          cp dist/SHA256SUMS.txt "$remote/"
          diff -qr dist "$remote"
          (cd "$remote" && sha256sum -c SHA256SUMS.txt)
          echo "MINIX_COMMON_V2_IMMUTABLE_RELEASE_PASS $tag $GITHUB_SHA"
