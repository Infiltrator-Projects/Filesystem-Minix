name: Build canonical Minix Common V2 filesystem SO
on:
  push:
    branches: [main]
  pull_request:
jobs:
  minix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Compile canonical MINIX.so
        run: |
          cmake -S . -B build-cmake -DCMAKE_BUILD_TYPE=Release
          cmake --build build-cmake --parallel 2
      - name: Verify only canonical Common V2 and historical test regressions
        run: |
          ctest --test-dir build-cmake --output-on-failure
          test -f build-cmake/MINIX.so
          nm -D --defined-only build-cmake/MINIX.so | grep -F infiltrator_filesystem_api_v2
          sh tests/check_production_v2.sh build-cmake/MINIX.so
      - uses: actions/upload-artifact@v4
        with:
          name: MINIX-common-v2-so
          path: |
            build-cmake/MINIX.so
            docs/Minix.pdf
      - name: Verify exactly one PDF per runtime SO
        shell: bash
        run: |
          set -euo pipefail
          stage="$(mktemp -d)"
          trap 'rm -rf "$stage"' EXIT
          DESTDIR="$stage" cmake --install build-cmake
          test "$(find "$stage" -type f | wc -l)" -eq 2
          test -f "$stage/System/Filesystems/MINIX.so"
          test -f "$stage/System/Resources/Documentation/Filesystem-Minix.pdf"
          test "$(head -c 5 "$stage/System/Resources/Documentation/Filesystem-Minix.pdf")" = '%PDF-'
