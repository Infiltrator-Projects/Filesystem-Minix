name: Build combined Minix filesystem SO
on:
  push:
    branches: [main]
  pull_request:
jobs:
  minix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Compile canonical MINIX.so
        run: |
          cmake -S . -B build-cmake -DCMAKE_BUILD_TYPE=Release
          cmake --build build-cmake --parallel 2
      - name: Verify old filesystem API and new Defrag API
        run: |
          ctest --test-dir build-cmake --output-on-failure
          test -f build-cmake/MINIX.so
          nm -D build-cmake/MINIX.so | grep -F infiltrator_filesystem_module_v2
          nm -D build-cmake/MINIX.so | grep -F infiltrator_filesystem_minix_defrag_v1
      - uses: actions/upload-artifact@v4
        with:
          name: MINIX-combined-so
          path: build-cmake/MINIX.so
      - name: Verify exactly one PDF per runtime SO
        shell: bash
        run: |
          set -euo pipefail
          stage="$(mktemp -d)"
          trap 'rm -rf "$stage"' EXIT
          DESTDIR="$stage" cmake --install build-cmake
          test "$(find "$stage" -type f | wc -l)" -eq 2
          test -f "$stage/System/Filesystems/MINIX.so"
          test -f "$stage/System/Resources/Documentation/Filesystem-Minix/Minix.pdf"
          test "$(head -c 5 "$stage/System/Resources/Documentation/Filesystem-Minix/Minix.pdf")" = '%PDF-'
