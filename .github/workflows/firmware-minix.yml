# SPDX-License-Identifier: GPL-3.0-or-later
name: Qualify MINIX Common V2 BOOT read-only module
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  minix-uefi:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Install independent UEFI and Minix media tooling
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake libssl-dev cpio busybox-static \
            util-linux e2fsprogs dosfstools gdisk mtools qemu-system-x86 ovmf
      - name: Get authenticated production BOOT validation contract
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/minix-firmware"
          mkdir -p "$work"
          boot=infiltrator-boot_0.1.69_amd64.deb
          curl -fsSL --retry 3 \
            "https://github.com/Infiltrator-Projects/Boot/releases/download/v0.1.69/$boot" \
            -o "$work/$boot"
          printf '%s  %s\n' \
            73429727974a902372f7d2644d00bb1f527e42b4454f9f3cafbf8ef1ad6c9a8e \
            "$work/$boot" | sha256sum -c -
          dpkg-deb -x "$work/$boot" "$work/boot"
      - name: Require V2-only carrier and actual production validator
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/minix-firmware"
          cmake -S . -B "$work/build" -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
          cmake --build "$work/build" --parallel 2
          ctest --test-dir "$work/build" --output-on-failure
          test -s "$work/build/MINIX.so"
          test -s "$work/build/firmware/MINIX.so"
          sh tests/check_production_v2.sh "$work/build/MINIX.so"
          validator="$work/boot/usr/lib/infiltrator-boot/validate-module"
          "$validator" "$work/build/firmware/MINIX.so"
          "$validator" "$work/build/MINIX.so"
          DESTDIR="$work/stage" cmake --install "$work/build"
          cmp "$work/stage/System/Filesystems/MINIX.so" "$work/build/MINIX.so"
          "$validator" "$work/stage/System/Filesystems/MINIX.so"
      - name: Prove real kernel and initramfs from clean Minix V3 and corrupt rejection
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/minix-firmware"
          image=$(apt-cache depends linux-image-generic | awk '/Depends: linux-image-[0-9]/ { image=$2 } END { print image }')
          test -n "$image"
          (cd "$work" && apt-get download "linux-image-unsigned-${image#linux-image-}")
          dpkg-deb -x "$work"/linux-image-unsigned-*.deb "$work/kernel"
          kernel="$work/kernel/boot/vmlinuz-${image#linux-image-}"
          test -s "$kernel"
          boot="$work/boot/usr/lib/infiltrator-boot/EFI/BOOT/BOOTX64.EFI"
          module="$work/stage/System/Filesystems/MINIX.so"
          bash tests/firmware-minix.sh "$boot" "$module" "$kernel" "$work/vm"
          bash tests/firmware-minix.sh "$boot" "$module" "$kernel" "$work/bad-vm" bad-superblock
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: minix-boot-ovmf-serial
          path: |
            ${{ runner.temp }}/minix-firmware/vm/serial.log
            ${{ runner.temp }}/minix-firmware/bad-vm/serial.log
          if-no-files-found: warn
