# SPDX-License-Identifier: GPL-3.0-or-later
# Source-owned Minix V1/V2/V3 media readers use only Common V2 filesystem ABI.
name: Qualify MINIX freestanding Common V2 reader
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  minix-uefi:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Build and run real native media and Common V2 tests
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B build/firmware-ci -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
          cmake --build build/firmware-ci --parallel 2
          ctest --test-dir build/firmware-ci --output-on-failure
      - name: Verify exact installed V2 module and freestanding reader bytes
        shell: bash
        run: |
          set -euo pipefail
          DESTDIR="$RUNNER_TEMP/stage" cmake --install build/firmware-ci
          module="$RUNNER_TEMP/stage/System/Filesystems/MINIX.so"
          test -s "$module"
          cmp "$module" build/firmware-ci/MINIX.so
          bash tests/check-freestanding-v2.sh "$module"
          objcopy --dump-section ".infiltrator_boot=$RUNNER_TEMP/firmware.so" \
            "$module" "$RUNNER_TEMP/carrier.so"
          cmp "$RUNNER_TEMP/firmware.so" build/firmware-ci/firmware/MINIX.so
          echo MINIX_V2_EMBEDDED_READER_AND_MEDIA_PASS
